<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ლევან, მნიშვნელოვანი კითხვა... ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Comfortaa', cursive, sans-serif;
            touch-action: manipulation;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
            50% { transform: translateY(-20px) rotate(10deg); opacity: 1; }
            100% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
        }

        .floating-heart {
            position: absolute;
            animation: float 4s ease-in-out infinite;
            pointer-events: none;
            user-select: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .fade-transition {
            transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
        }

        .pulse-slow {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Floating tooltips for No button */
        .funny-tooltip {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-200 via-rose-100 to-red-200 min-h-screen flex items-center justify-center p-4 overflow-hidden relative select-none">

    <!-- Floating Background Hearts -->
    <div id="bg-hearts-container" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

    <main class="relative z-10 w-full max-w-lg">
        <div class="glass-card rounded-3xl p-6 sm:p-10 shadow-2xl text-center border border-white/60 relative">
            
            <!-- STEP 1: Text Carousel & Intro Question -->
            <div id="step-1" class="flex flex-col items-center transition-all duration-500">
                <div class="text-6xl sm:text-7xl mb-4 pulse-slow">
                    💌
                </div>

                <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 mb-6">
                    ლევან,
                </h1>

                <!-- Carousel text section -->
                <div class="min-h-[120px] flex items-center justify-center w-full px-2 mb-6">
                    <p id="carousel-text" class="text-base sm:text-lg text-rose-700 font-semibold leading-relaxed fade-transition opacity-100 transform translate-y-0">
                        • იმიტომ რომ ძალიან მიყვარხარ
                    </p>
                </div>

                <!-- Dots indicator -->
                <div class="flex gap-2 mb-8">
                    <span id="dot-0" class="w-3 h-3 rounded-full bg-rose-500 transition-all"></span>
                    <span id="dot-1" class="w-3 h-3 rounded-full bg-rose-200 transition-all"></span>
                    <span id="dot-2" class="w-3 h-3 rounded-full bg-rose-200 transition-all"></span>
                </div>

                <div class="border-t border-rose-200/60 w-full pt-6">
                    <p class="text-gray-700 text-base sm:text-lg font-medium mb-5">
                        ერთი უმნიშვნელოვანესი კითხვა მაქვს ....
                    </p>

                    <button onclick="goToStep2()" class="w-full bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold py-4 px-8 rounded-2xl shadow-lg hover:shadow-xl transform active:scale-95 transition-all duration-200 text-lg sm:text-xl flex items-center justify-center gap-2">
                        <span>რა კითხვა?</span>
                        <span>👉✨</span>
                    </button>
                </div>
            </div>

            <!-- STEP 2: Main Proposal & Dodging Button -->
            <div id="step-2" class="hidden flex-col items-center transition-all duration-500">
                <div class="text-6xl sm:text-7xl mb-4 animate-bounce">
                    ❓✨
                </div>

                <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-8 leading-relaxed">
                    გაატარებ ხვალ მთელ დღეს და ღამეს ჩემთან ერთად? ❤️
                </h2>

                <!-- Action Buttons -->
                <div class="relative w-full min-h-[120px] flex items-center justify-center">
                    <div class="flex flex-row items-center justify-center gap-6 w-full">
                        <!-- YES BUTTON -->
                        <button id="yes-btn" onclick="acceptInvite()" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-extrabold py-4 px-9 rounded-2xl shadow-xl hover:shadow-2xl transform hover:scale-105 active:scale-95 transition-all text-xl z-20">
                            კი! 🥰
                        </button>

                        <!-- NO BUTTON (RUNS AWAY) -->
                        <button id="no-btn" class="bg-gradient-to-r from-rose-400 to-red-400 text-white font-bold py-4 px-9 rounded-2xl shadow-lg text-xl z-30 transition-all duration-150">
                            არა 😜
                        </button>
                    </div>
                </div>
            </div>

            <!-- STEP 3: Success Screen -->
            <div id="step-3" class="hidden flex-col items-center animate-fadeIn">
                <div class="text-7xl sm:text-8xl mb-4 animate-bounce">
                    🎉
                </div>
                <h1 class="text-3xl sm:text-4xl font-black text-rose-600 mb-4">
                    იეეეს! ❤️
                </h1>
                <p class="text-lg sm:text-xl font-semibold text-gray-800 mb-6 leading-relaxed">
                    ვიცოდი რომ დამთანხმდებოდი! ✨<br>
                    შეხვედრამდე! ☕🍰💖
                </p>
                <div class="p-4 bg-rose-50 rounded-2xl border border-rose-200 text-rose-700 text-base font-semibold shadow-inner w-full">
                    გელოდები ძალიან! 🥰
                </div>
            </div>

        </div>
    </main>

    <!-- Floating Toast Message Container -->
    <div id="toast-container"></div>

    <script>
        
        // Carousel items
        const messages = [
            "• იმიტომ რომ ძალიან მიყვარხარ",
            "• იმიტომ რომ ძალიან მომენატრე",
            "• იმიტომ, რომ მინდა რომ ცოტახნით სულ ყველაფერი დამავიწყდეს და ძალიან ბევრი ვიცინო შენთან ერთად."
        ];

        // Funny phrases when 'No' button dodges
        const funnyPhrases = [
            "Ooops! 😜",
            "მგონი არ მუშაობს! 😂",
            "კიდევ სცადე! 🙈",
            "ვერ დამიჭერ! 🏃‍♂️",
            "შანსი არაა! 💖",
            "ისევ ააცილე! 🤪",
            "არა ღილაკი გაფუჭდა! 🛠️",
            "ტყუილად ცდილობ! 😜",
            "მხოლოდ «კი» მუშაობს! ✨"
        ];

        let currentMsgIndex = 0;

        // Rotate carousel text every 3 seconds
        function rotateCarousel() {
            const textEl = document.getElementById('carousel-text');
            
            // Fade out
            textEl.classList.remove('opacity-100', 'translate-y-0');
            textEl.classList.add('opacity-0', '-translate-y-2');

            setTimeout(() => {
                // Update text index
                currentMsgIndex = (currentMsgIndex + 1) % messages.length;
                textEl.innerText = messages[currentMsgIndex];

                // Update dots
                for (let i = 0; i < messages.length; i++) {
                    const dot = document.getElementById(`dot-${i}`);
                    if (i === currentMsgIndex) {
                        dot.className = "w-3 h-3 rounded-full bg-rose-500 transition-all";
                    } else {
                        dot.className = "w-3 h-3 rounded-full bg-rose-200 transition-all";
                    }
                }

                // Fade in
                textEl.classList.remove('opacity-0', '-translate-y-2');
                textEl.classList.add('opacity-100', 'translate-y-0');
            }, 500);
        }

        setInterval(rotateCarousel, 3200);


        // Transition from Step 1 to Step 2
        function goToStep2() {
            document.getElementById('step-1').classList.add('hidden');
            const step2 = document.getElementById('step-2');
            step2.classList.remove('hidden');
            step2.classList.add('flex');
        }

        // Running No Button Logic
        const noBtn = document.getElementById('no-btn');
        let isAbsolute = false;

        function moveNoButton(e) {
            if (e) e.preventDefault();

            if (!isAbsolute) {
                noBtn.style.position = 'fixed';
                isAbsolute = true;
            }

            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            // Safe viewport bounds
            const padding = 24;
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;

            // Show funny floating toast near the new location
            showFunnyToast(randomX, randomY);
        }

        // Show a temporary funny tooltip message
        function showFunnyToast(x, y) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const randomPhrase = funnyPhrases[Math.floor(Math.random() * funnyPhrases.length)];
            
            toast.className = 'funny-tooltip bg-gray-900 text-white font-bold text-sm px-4 py-2 rounded-xl shadow-2xl border border-pink-400';
            toast.innerText = randomPhrase;

            // Position toast slightly above the button
            const toastY = Math.max(10, y - 45);
            const toastX = Math.min(window.innerWidth - 160, Math.max(10, x - 10));

            toast.style.left = `${toastX}px`;
            toast.style.top = `${toastY}px`;

            container.appendChild(toast);

            // Auto remove toast
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 1200);
        }

        // Hover & Touch Events
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);


        // Step 3: Accept Invitation
        function acceptInvite() {
            document.getElementById('step-2').classList.add('hidden');
            const step3 = document.getElementById('step-3');
            step3.classList.remove('hidden');
            step3.classList.add('flex');

            // Remove any leftover funny toasts
            document.getElementById('toast-container').innerHTML = '';
            
            // Hide running button if floating
            noBtn.style.display = 'none';

            // Launch fireworks & confetti
            triggerConfetti();
        }

        // Fireworks celebration
        function triggerConfetti() {
            const duration = 3 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff0055', '#ff5050', '#ffc0cb', '#ffffff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff0055', '#ff5050', '#ffc0cb', '#ffffff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            })();
        }

        // Generate dynamic ambient floating background hearts
        function createBgHearts() {
            const container = document.getElementById('bg-hearts-container');
            const heartIcons = ['❤️', '💖', '💗', '💓', '✨', '🌸'];
            const count = 18;

            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.top = `${Math.random() * 100}%`;
                heart.style.fontSize = `${Math.random() * 20 + 16}px`;
                heart.style.animationDelay = `${Math.random() * 4}s`;
                heart.style.animationDuration = `${Math.random() * 3 + 3}s`;
                container.appendChild(heart);
            }
        }

        window.onload = function() {
            createBgHearts();
        };
    </script>
</body>
</html>
