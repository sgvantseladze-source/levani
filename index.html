<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ლევან, მნიშვნელოვანი კითხვა</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-900: #0a1428;
    --navy-800: #0f1f3d;
    --navy-700: #16315e;
    --gold: #d4af37;
    --gold-soft: #e8cf7a;
    --sky: #8ec5ff;
    --text: #e9eefb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Comfortaa', 'Noto Sans Georgian', sans-serif;
    background: radial-gradient(circle at 20% 15%, var(--navy-700) 0%, var(--navy-800) 45%, var(--navy-900) 100%);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden; position: relative;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }

  /* background floating stars */
  #bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .star {
    position: absolute; border-radius: 50%;
    background: var(--gold-soft);
    animation: float 5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); opacity: .25; }
    50% { transform: translateY(-18px); opacity: .8; }
  }

  main { position: relative; z-index: 10; width: 100%; max-width: 520px; }
  .card {
    background: rgba(15, 31, 61, 0.78);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(212, 175, 55, 0.45);
    border-radius: 24px; padding: 40px 28px; text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,.5), inset 0 0 0 1px rgba(142,197,255,.08);
  }
  .step { display: none; flex-direction: column; align-items: center; }
  .step.active { display: flex; animation: fadeIn .6s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .divider { width: 60px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 0 auto 22px; }
  h1.name { font-size: 2.2rem; font-weight: 700; color: var(--gold); margin-bottom: 14px; letter-spacing: .5px; }
  h2.question { font-size: 1.55rem; font-weight: 700; line-height: 1.6; margin-bottom: 36px; color: var(--text); }

  .carousel { min-height: 110px; display: flex; align-items: center; justify-content: center; padding: 0 6px; margin-bottom: 18px; width: 100%; }
  #carousel-text {
    font-size: 1.1rem; font-weight: 600; line-height: 1.7; color: var(--sky);
    transition: opacity .5s ease, transform .5s ease; opacity: 1; transform: translateY(0);
  }
  #carousel-text.out { opacity: 0; transform: translateY(-8px); }

  .dots { display: flex; gap: 8px; margin-bottom: 28px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(142,197,255,.25); transition: all .3s; }
  .dot.on { background: var(--gold); transform: scale(1.25); }

  .intro-q { border-top: 1px solid rgba(212,175,55,.3); width: 100%; padding-top: 24px; }
  .intro-q p { font-size: 1.05rem; font-weight: 600; margin-bottom: 18px; color: var(--text); }

  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-gold {
    width: 100%; padding: 16px 28px; border-radius: 14px;
    background: linear-gradient(135deg, var(--gold), var(--gold-soft));
    color: var(--navy-900); font-weight: 700; font-size: 1.1rem;
    box-shadow: 0 8px 22px rgba(212,175,55,.3);
    transition: transform .15s, box-shadow .2s;
  }
  .btn-gold:hover { box-shadow: 0 10px 28px rgba(212,175,55,.5); transform: translateY(-1px); }
  .btn-gold:active { transform: scale(.97); }

  .actions { display: flex; gap: 22px; align-items: center; justify-content: center; min-height: 80px; width: 100%; }
  #yes-btn {
    padding: 16px 44px; border-radius: 14px; font-size: 1.2rem; font-weight: 700;
    background: linear-gradient(135deg, var(--gold), var(--gold-soft)); color: var(--navy-900);
    box-shadow: 0 8px 24px rgba(212,175,55,.35); transition: transform .15s; z-index: 20;
  }
  #yes-btn:hover { transform: scale(1.06); }
  #yes-btn:active { transform: scale(.96); }

  #no-slot { display: inline-block; }
  #no-btn {
    padding: 16px 36px; border-radius: 14px; font-size: 1.2rem; font-weight: 700;
    background: transparent; color: var(--sky); border: 2px solid var(--sky);
    white-space: nowrap; z-index: 50;
    transition: left .25s ease, top .25s ease;
  }
  #no-btn.pop { animation: pop .4s cubic-bezier(.175,.885,.32,1.5); }
  @keyframes pop {
    0% { transform: scale(.6) rotate(-6deg); }
    60% { transform: scale(1.15) rotate(4deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .win {
    font-size: 2.4rem; font-weight: 700; color: var(--gold); line-height: 1.5;
    padding: 30px 0; letter-spacing: .5px; word-break: break-word;
  }
</style>
</head>
<body>
  <div id="bg"></div>

  <main>
    <div class="card">

      <!-- STEP 1 -->
      <div id="step-1" class="step active">
        <h1 class="name">ლევან,</h1>
        <div class="divider"></div>

        <div class="carousel"><p id="carousel-text">იმიტომ რომ ძალიან მიყვარხარ</p></div>

        <div class="dots">
          <span class="dot on" id="dot-0"></span>
          <span class="dot" id="dot-1"></span>
          <span class="dot" id="dot-2"></span>
        </div>

        <div class="intro-q">
          <p>ერთი უმნიშვნელოვანესი კითხვა მაქვს ....</p>
          <button class="btn-gold" onclick="goToStep2()">რა კითხვა?</button>
        </div>
      </div>

      <!-- STEP 2 -->
      <div id="step-2" class="step">
        <h2 class="question">გაატარებ ხვალ მთელ დღეს და ღამეს ჩემთან ერთად?</h2>
        <div class="actions">
          <button id="yes-btn" onclick="acceptInvite()">კი</button>
          <span id="no-slot"><button id="no-btn">არა</button></span>
        </div>
      </div>

      <!-- STEP 3 -->
      <div id="step-3" class="step">
        <div class="win">ვიცოდი რაააააააააა</div>
      </div>

    </div>
  </main>

<script>
  /* ---------- background stars ---------- */
  (function () {
    const bg = document.getElementById('bg');
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 4 + 2;
      s.style.width = s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = Math.random() * 5 + 's';
      s.style.animationDuration = (Math.random() * 3 + 4) + 's';
      bg.appendChild(s);
    }
  })();

  /* ---------- carousel (no bullets) ---------- */
  const messages = [
    "იმიტომ რომ ძალიან მიყვარხარ",
    "იმიტომ რომ ძალიან მომენატრე",
    "იმიტომ, რომ მინდა რომ ცოტახნით სულ ყველაფერი დამავიწყდეს და ძალიან ბევრი ვიცინო შენთან ერთად."
  ];
  let idx = 0;
  const textEl = document.getElementById('carousel-text');

  setInterval(() => {
    textEl.classList.add('out');
    setTimeout(() => {
      idx = (idx + 1) % messages.length;
      textEl.textContent = messages[idx];
      messages.forEach((_, i) =>
        document.getElementById('dot-' + i).classList.toggle('on', i === idx));
      textEl.classList.remove('out');
    }, 500);
  }, 3200);

  /* ---------- steps ---------- */
  function show(id) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function goToStep2() { show('step-2'); }

  /* ---------- the runaway "No" button ---------- */
  const noBtn = document.getElementById('no-btn');
  const noSlot = document.getElementById('no-slot');
  const phrases = [
    "Ooops!",
    "მგონი არ მუშაობს!",
    "კიდევ სცადე!",
    "ვერ დამიჭერ!",
    "ამაოდ ცდილობ!",
    "შანსი არაა!",
    "ცოტა ხანს დაისვენე!",
    "ისევ ააცილე!",
    "ღილაკი გაფუჭდა!",
    "მხოლოდ „კი“ მუშაობს!"
  ];
  let floating = false;
  let lastPhrase = -1;
  let lastMove = 0;

  function nextPhrase() {
    let i;
    do { i = Math.floor(Math.random() * phrases.length); } while (i === lastPhrase);
    lastPhrase = i;
    return phrases[i];
  }

  function dodge(e) {
    if (e && e.cancelable) e.preventDefault();

    const now = Date.now();
    if (now - lastMove < 180) return;   // avoid jitter
    lastMove = now;

    if (!floating) {
      // keep layout space, then detach the button
      const r = noBtn.getBoundingClientRect();
      noSlot.style.width = r.width + 'px';
      noSlot.style.height = r.height + 'px';
      noBtn.style.position = 'fixed';
      noBtn.style.left = r.left + 'px';
      noBtn.style.top = r.top + 'px';
      floating = true;
    }

    // change the text in place with animation
    noBtn.textContent = nextPhrase();
    noBtn.classList.remove('pop');
    void noBtn.offsetWidth;
    noBtn.classList.add('pop');

    // jump to a new random spot
    const w = noBtn.offsetWidth, h = noBtn.offsetHeight, pad = 16;
    const maxX = Math.max(pad, window.innerWidth - w - pad);
    const maxY = Math.max(pad, window.innerHeight - h - pad);
    noBtn.style.left = (pad + Math.random() * (maxX - pad)) + 'px';
    noBtn.style.top = (pad + Math.random() * (maxY - pad)) + 'px';
  }

  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('touchstart', dodge, { passive: false });
  noBtn.addEventListener('pointerdown', dodge);
  noBtn.addEventListener('click', dodge);

  // also dodge when the cursor merely gets close
  document.addEventListener('mousemove', (e) => {
    if (!floating) return;
    const r = noBtn.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (Math.hypot(e.clientX - cx, e.clientY - cy) < 90) dodge();
  });

  /* ---------- victory ---------- */
  function acceptInvite() {
    noBtn.style.display = 'none';
    show('step-3');
    fireworks();
  }

  function fireworks() {
    const end = Date.now() + 5000;
    const colors = ['#d4af37', '#e8cf7a', '#8ec5ff', '#ffffff', '#16315e'];
    (function frame() {
      confetti({ particleCount: 6, angle: 60, spread: 60, origin: { x: 0, y: 0.8 }, colors });
      confetti({ particleCount: 6, angle: 120, spread: 60, origin: { x: 1, y: 0.8 }, colors });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
    const burst = setInterval(() => {
      if (Date.now() > end) return clearInterval(burst);
      confetti({
        particleCount: 70, spread: 360, startVelocity: 28, ticks: 60,
        origin: { x: Math.random() * 0.8 + 0.1, y: Math.random() * 0.4 + 0.1 },
        colors
      });
    }, 350);
  }
</script>
</body>
</html>
